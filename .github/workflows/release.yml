# Release CD (ADR-0072 S4, #1346). Builds the frozen product across platforms
# and publishes to GitHub Releases on two channels:
#   - Stable: a tag push (v*) -> a normal release for that tag.
#   - Bleeding edge: a nightly schedule -> a single rolling `nightly` prerelease,
#     built ONLY when master advanced past the last one (SHA compare, not a time
#     window), so a quiet night is a few seconds of the gate job and nothing else.
#
# This ships raw zipped onedir artifacts (one per platform). Native installers
# are S5; the auto-update client is S6/S7; macOS stays unsigned/experimental.
#
# Pre-merge verification: the paths-filtered pull_request trigger runs the full
# build matrix (never the publish job) on every packaging change, so a real
# runner build on windows/macOS/linux-x64/linux-arm64 is exercised before merge.
# workflow_dispatch (dry_run) also triggers a manual build with no publish.
name: release

on:
  push:
    tags: ['v*']
  # Build-only validation (never publishes) whenever the packaging surface
  # changes — this is what catches a platform-specific freeze break (a missing
  # runtime dep, a mac/arm hidden import) before it reaches a release.
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'backend/pyproject.toml'
      - 'backend/requirements.lock'
  schedule:
    # 23:00 UTC = 00:00 CET (winter) / 01:00 CEST (summer) — midnight in
    # European local time, so a fresh nightly is ready by morning. GitHub cron
    # is UTC-only with no DST handling, so a single time drifts ±1h across the
    # year; that's immaterial for a nightly. Don't "fix" the drift with two
    # month-gated crons.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, upload workflow artifacts, do NOT publish a release'
        type: boolean
        default: true

# Least privilege by default; only `publish` escalates to write (releases + tag).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a publishing run mid-flight

jobs:
  # Decide whether to build, and on which channel. The nightly no-op lives here:
  # if HEAD already equals the commit the `nightly` tag points at, skip entirely.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      channel: ${{ steps.decide.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history + tags to compare against `nightly`
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "push" ]; then
            # A v* tag push -> stable.
            echo "channel=stable"      >> "$GITHUB_OUTPUT"
            echo "should_build=true"   >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$event" = "pull_request" ]; then
            # Build-only validation; the publish job refuses this channel.
            echo "channel=pr"        >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # schedule or workflow_dispatch -> nightly channel, with the skip check.
          echo "channel=nightly" >> "$GITHUB_OUTPUT"
          head="$(git rev-parse HEAD)"
          if nightly_sha="$(git rev-parse -q --verify refs/tags/nightly)"; then
            if [ "$head" = "$nightly_sha" ]; then
              echo "No new commits since the last nightly ($head) — skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "master advanced ($nightly_sha -> $head) — building."
          else
            echo "No nightly tag yet — building the first one."
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-latest
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.12 (not gates' 3.14): the matrix hits macOS + linux-arm64, where
          # mature wheels for the Rust-backed deps (pydantic-core, tiktoken) are
          # far more certain than on 3.14. Pinned for reproducible releases.
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend (from the lockfile)
        run: npm ci --prefix frontend

      # Non-Linux freezes on the host. Linux freezes inside a glibc-2.31 container
      # (below), which installs its own copy — so the host install is win/mac only.
      # Deps from the lock (#1393): the freeze bundles whatever is installed, so
      # an unpinned resolve here would make the shipped binary for a given tag
      # depend on the build date.
      - name: Install backend + build extra (locked deps)
        if: runner.os != 'Linux'
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install -e backend --no-deps

      # macOS only: build the .icns before the freeze so the spec's BUNDLE
      # embeds it in the .app (ADR-0072 S5).
      - name: Prepare the macOS icon (.icns)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/make-icns.sh
          packaging/macos/make-icns.sh

      # Non-Linux: freeze on the host runner.
      - name: Build the frozen artifact (frontend build + PyInstaller)
        if: runner.os != 'Linux'
        run: python packaging/build.py

      # Linux: freeze inside a glibc-2.31 container (#1376). PyInstaller binaries
      # link glibc, which is forward-compatible only, so a binary frozen on the
      # runner's glibc 2.39 fails on any older distro — including a Raspberry Pi on
      # Debian Bullseye (glibc 2.31) and even current Pi OS Bookworm (2.36).
      # `python:3.12-bullseye` is Debian 11 + Python 3.12 (glibc 2.31), so the
      # frozen binary runs on Bullseye and everything newer. Node from the host
      # `npm ci` (mounted, same Linux arch) is reused; the container just adds a
      # node binary + the build extra, then runs the same `build.py`. Runs natively
      # on each runner's arch (arm64 runner → arm64 image), no emulation.
      - name: Build the frozen artifact (Linux, in a glibc-2.31 container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # -e GITHUB_SHA: docker run does NOT inherit host env, and the spec bakes
          # $GITHUB_SHA as the build stamp (S6a) the nightly channel compares — pass
          # it through or Linux builds ship a blank stamp.
          docker run --rm -e GITHUB_SHA -v "$PWD":/src -w /src python:3.12-bullseye bash -c '
            set -euo pipefail
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y --no-install-recommends nodejs
            python -m pip install -r backend/requirements.lock
            python -m pip install -e backend --no-deps
            python packaging/build.py
          '
          # The container writes dist/ as root; hand it back to the runner user so
          # the host packaging steps (tar/zip/appimage) can read and repack it.
          sudo chown -R "$(id -u):$(id -g)" dist

      # Prove the frozen binary actually WORKS on this platform: --self-check
      # imports the full chain AND opens a throwaway project through the real
      # service layer (node index, schema, built-in Library), exiting 0/1. This
      # is the guard for the frozen x real-project class of bug that --help /
      # health can't reach (#1350; caught httpx + node-index build_identity late).
      - name: Smoke — the frozen binary opens a project (--self-check)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/local-writing-app/local-writing-app.exe --self-check
          else
            ./dist/local-writing-app/local-writing-app --self-check
          fi

      # Linux: self-check INSIDE a glibc-2.31 container, not on the host. Running it
      # on the runner's glibc 2.39 always passes (forward-compat) and proves nothing
      # about the floor — that blind spot is exactly what shipped the Pi break
      # (#1376). debian:11 is the oldest glibc we target; if a future change raises
      # the floor above it, this fails in CI instead of on a user's Pi.
      - name: Smoke — frozen binary self-check on the glibc-2.31 floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src debian:11 \
            ./dist/local-writing-app/local-writing-app --self-check

      # Browser-level wiring smoke (#1352): drive a real browser through ~5 core
      # flows (boot, rehydrate, create via wizard, type+autosave, settings)
      # against THIS platform's frozen binary. Closes the frozen × browser-wiring
      # seam the unit/component/integration layers structurally can't reach —
      # same-origin serving, the `/api` base, a bundle that actually boots.
      # Playwright owns the binary's lifecycle via its webServer (E2E_FROZEN_BIN).
      - name: Install Playwright browser (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke — browser E2E against the frozen binary
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_FROZEN_BIN: ${{ runner.os == 'Windows' && '../dist/local-writing-app/local-writing-app.exe' || '../dist/local-writing-app/local-writing-app' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.platform }}
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Package the onedir into a zip
        shell: bash
        run: python -c "import shutil,os; shutil.make_archive('local-writing-app-'+os.environ['PLAT'], 'zip', 'dist', 'local-writing-app')"
        env:
          PLAT: ${{ matrix.platform }}

      - name: Upload the platform zip (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: local-writing-app-${{ matrix.platform }}.zip
          if-no-files-found: error

      # Linux only: also ship a server tarball (onedir + systemd installer) for
      # the headless-Pi target (ADR-0072 §8). tar.gz preserves the executable
      # bit and symlinks that a zip drops.
      - name: Package Linux server tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          staging="local-writing-app-${PLAT}-server"
          mkdir -p "$staging"
          cp -a dist/local-writing-app "$staging/"
          cp packaging/linux/install-server.sh "$staging/"
          cp packaging/linux/README-server.md "$staging/"
          chmod +x "$staging/install-server.sh"
          tar -czf "${staging}.tar.gz" "$staging"
        env:
          PLAT: ${{ matrix.platform }}

      - name: Upload the Linux server tarball (workflow artifact)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-server
          path: local-writing-app-${{ matrix.platform }}-server.tar.gz
          if-no-files-found: error

      # Windows only: wrap the onedir in an Inno Setup installer (ADR-0072 S5) —
      # per-user (no admin), Start-menu shortcut, uninstaller, app icon.
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])"
          Write-Host "installer version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss "/DMyAppVersion=$version"

      - name: Upload the Windows installer (workflow artifact)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: dist-installer/local-writing-app-windows-x64-setup.exe
          if-no-files-found: error

      # linux-x64 only: a desktop AppImage (ADR-0072 §8). The Pi/server target
      # uses the tarball above; arm64 desktops are rare, so no arm AppImage.
      - name: Build the Linux AppImage (desktop)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir
          mkdir -p AppDir/app
          cp -a dist/local-writing-app/. AppDir/app/
          cp packaging/icons/icon-256.png AppDir/local-writing-app.png
          cp packaging/linux/appimage/local-writing-app.desktop AppDir/local-writing-app.desktop
          cp packaging/linux/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/app/local-writing-app
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # --appimage-extract-and-run: run appimagetool without FUSE (CI has none).
          ./appimagetool --appimage-extract-and-run AppDir local-writing-app-linux-x64.AppImage

      - name: Upload the Linux AppImage (workflow artifact)
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: local-writing-app-linux-x64.AppImage
          if-no-files-found: error

      # macOS only: a drag-to-Applications .dmg from the .app the spec's BUNDLE
      # produced (ADR-0072 S5/§10). Unsigned/experimental — Gatekeeper warns.
      - name: Build the macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/make-dmg.sh
          packaging/macos/make-dmg.sh "local-writing-app-${PLAT}.dmg"
        env:
          PLAT: ${{ matrix.platform }}

      - name: Upload the macOS dmg (workflow artifact)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-dmg
          path: local-writing-app-${{ matrix.platform }}.dmg
          if-no-files-found: error

  publish:
    needs: [gate, build]
    # Publishes only for a real tag push or nightly schedule. Never for a PR
    # (build-only validation) or a dry-run dispatch.
    if: >-
      needs.gate.outputs.should_build == 'true' &&
      needs.gate.outputs.channel != 'pr' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update releases and move the `nightly` tag
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts   # -> artifacts/<platform>/local-writing-app-<platform>.zip

      # Fail loudly if the matrix somehow produced no zips (each build job uploads
      # one artifact folder; download-artifact lays them out as artifacts/<name>/).
      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          echo "found ${#files[@]} asset(s):"
          printf '  %s\n' "${files[@]}"
          test "${#files[@]}" -ge 1
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/assets.txt"

      - name: Publish stable release
        if: needs.gate.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/assets.txt"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Frozen builds for $GITHUB_REF_NAME. Unsigned; macOS is experimental."

      - name: Publish/update the rolling nightly prerelease
        if: needs.gate.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/assets.txt"
          # Move the rolling tag to this commit (the gate compares against it).
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          # Recreate the prerelease so its assets and target commit are fresh.
          # (delete keeps the tag by default — we just moved it above.)
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly "${files[@]}" \
            --prerelease \
            --title "Nightly (bleeding edge)" \
            --notes "The latest build from master. Unsigned; macOS is experimental."
