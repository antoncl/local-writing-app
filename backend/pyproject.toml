[project]
name = "local-writing-service"
version = "0.9.5"
description = "Local application service for a private fiction writing app"
requires-python = ">=3.11"
# These ranges are declared INTENT; the versions every install actually gets
# come from requirements.lock (#1393). After editing dependencies here, run
#   python scripts/relock_backend.py
# to regenerate the lock — this file alone never changes what installs.
dependencies = [
  "anthropic>=0.40.0",
  # <0.141: FastAPI 0.141 relaxed its Starlette pin onto the >=1.4 line, which
  # changed edge-case routing behaviour (405 where 1.3 returned 404) and is
  # untested here. Lifting this cap is the deliberate upgrade tracked in #1456,
  # not a relock side effect.
  "fastapi>=0.115.0,<0.141",
  # A genuine RUNTIME dependency: every provider profile
  # (services/ai/profiles/*.py) drives its health check / calls through
  # httpx.AsyncClient, imported at app-load via the provider registry. It is
  # NOT pulled transitively any more — anthropic/openai moved to `httpx2` — so a
  # frozen build without this line ModuleNotFound's on the AI import chain (the
  # `[dev]`-only listing masked it, since dev installs it for TestClient too).
  "httpx>=0.28",
  "jinja2>=3.1.0",
  "openai>=1.50.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  # Transitive via FastAPI, but named to hold the tested minor line: 1.4+
  # changed routing edge cases (see the fastapi cap above, and #1456).
  "starlette>=1.3,<1.4",
  "tiktoken>=0.8.0",
  "uvicorn[standard]>=0.30.0"
]

[project.scripts]
local-writing-app = "app.server:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.15",
  "pre-commit>=4.0",
  "pytest>=9",
  # A hung test must fail with a traceback, not sit there until the CI job's
  # 20-minute wall clock kills it and tells you nothing (#352 follow-up).
  "pytest-timeout>=2.3",
  # Parallel test execution (#1515). The suite is process-isolation-safe
  # (per-test tmp_path machine-settings redirect, in-process TestClient, no
  # fixed ports), so `-n auto` forks one worker per core — the windows-backend
  # CI job was the ~18-minute pacing bottleneck as a single serial run.
  "pytest-xdist>=3.6",
]
build = [
  "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
# Parallel by default (#1515). The suite is process-isolation-safe (per-test
# tmp_path machine-settings redirect, in-process TestClient, no fixed ports), so
# `-n auto` forks one worker per core with no cross-worker races — full suite
# ~8min serial -> ~1min on a 16-core dev box, and the windows CI job off its
# ~18min wall clock. Every `pytest` invocation inherits this, local and CI.
#   Debugging one test? xdist is incompatible with --pdb and spins up a worker
#   per core for a single case: disable it with `-n0`, e.g.
#     pytest backend/tests/test_x.py::test_name -n0 --pdb
addopts = ["-n", "auto"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Bug-catchers (F, B) first; the rest keep imports/idioms tidy.
# E501 (line length) is stylistic, not a bug source — left off.
# The per-function complexity rules (C901, PLR0912/13/15) are BLOCKING here as
# of #76: the whole backlog was burned to 0, so they now fail the commit / CI
# like any other rule rather than running advisory. The old advisory
# ruff-complexity pre-commit hook was retired in the same change.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "C901", "PLR0912", "PLR0913", "PLR0915"]
ignore = [
  "E501",   # line length — stylistic, not a bug source
  "UP042",  # str+Enum -> StrEnum changes str(member); the mix is deliberate
]

# Complexity thresholds. Args bumped from the default 5 — service methods /
# FastAPI routes legitimately take more.
[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Machine-generated grammar (scripts/viewgrammar, #277/ADR-0041) is exempt from
# the complexity limits: it is not hand-maintained and its branch count grows
# with the grammar (each slot adds a children() branch). Edit the IDL, not this.
"**/view_grammar_generated.py" = ["C901", "PLR0912", "PLR0915"]

