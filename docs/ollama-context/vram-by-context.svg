<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="VRAM used versus context size. At 8K and 32K the model stays around 3 to 5 GB, on the GPU. At 128K the 16-bit cache reaches about 18 GB and spills to the CPU, while the 8-bit cache stays near 10 GB, under a 12 GB example ceiling."><style>.l{font-family:var(--sans,"Segoe UI",system-ui,sans-serif)}.n{font-family:var(--mono,Consolas,ui-monospace,monospace);font-variant-numeric:tabular-nums}</style>
<rect x="-30" y="-30" width="920" height="380" fill="var(--diagram-bg,#ffffff)"/>
<line x1="70" y1="20" x2="70" y2="250" stroke="var(--border-strong,#b4c2bc)"/>
<line x1="70" y1="250" x2="820" y2="250" stroke="var(--border-strong,#b4c2bc)"/>
<text x="60" y="254" class="n" font-size="11" fill="var(--text-3,#74817b)" text-anchor="end">0</text>
<text x="60" y="200" class="n" font-size="11" fill="var(--text-3,#74817b)" text-anchor="end">5</text>
<text x="60" y="145" class="n" font-size="11" fill="var(--text-3,#74817b)" text-anchor="end">10</text>
<text x="60" y="90" class="n" font-size="11" fill="var(--text-3,#74817b)" text-anchor="end">15</text>
<text x="60" y="45" class="n" font-size="11" fill="var(--text-3,#74817b)" text-anchor="end">18</text>
<line x1="70" y1="113" x2="820" y2="113" stroke="var(--warn,#8a520d)" stroke-dasharray="2 5"/>
<text x="78" y="108" class="l" font-size="10.5" fill="var(--warn,#8a520d)">GPU memory (12 GB example)</text>
<text x="24" y="140" class="l" font-size="11" fill="var(--text-2,#4d5753)" transform="rotate(-90 24 140)" text-anchor="middle">VRAM used (GB)</text>
<rect x="150" y="215.6" width="34" height="34.4" rx="3" fill="var(--accent,#2f6f5e)"/>
<rect x="188" y="219" width="34" height="31" rx="3" fill="var(--accent,#2f6f5e)" opacity="0.5"/>
<text x="186" y="268" class="n" font-size="12" fill="var(--text,#242424)" text-anchor="middle" font-weight="600">8K</text>
<text x="167" y="208" class="n" font-size="10" fill="var(--text-2,#4d5753)" text-anchor="middle">3.1</text>
<text x="205" y="211" class="n" font-size="10" fill="var(--text-3,#74817b)" text-anchor="middle">2.7</text>
<rect x="360" y="188" width="34" height="62" rx="3" fill="var(--accent,#2f6f5e)"/>
<rect x="398" y="203.3" width="34" height="46.7" rx="3" fill="var(--accent,#2f6f5e)" opacity="0.5"/>
<text x="396" y="268" class="n" font-size="12" fill="var(--text,#242424)" text-anchor="middle" font-weight="600">32K</text>
<text x="377" y="180" class="n" font-size="10" fill="var(--text-2,#4d5753)" text-anchor="middle">~5.5</text>
<text x="415" y="195" class="n" font-size="10" fill="var(--text-3,#74817b)" text-anchor="middle">4.1</text>
<rect x="600" y="45" width="34" height="205" rx="3" fill="var(--danger,#a64a4a)"/>
<rect x="638" y="136.2" width="34" height="113.8" rx="3" fill="var(--accent,#2f6f5e)" opacity="0.5"/>
<text x="636" y="268" class="n" font-size="12" fill="var(--text,#242424)" text-anchor="middle" font-weight="600">128K</text>
<text x="617" y="38" class="n" font-size="10" fill="var(--danger,#a64a4a)" text-anchor="middle" font-weight="600">~18</text>
<text x="655" y="128" class="n" font-size="10" fill="var(--text-3,#74817b)" text-anchor="middle">~10</text>
<text x="617" y="235" class="l" font-size="9.5" fill="#fff" text-anchor="middle" transform="rotate(-90 617 235)">spills to CPU</text>
<rect x="150" y="288" width="14" height="14" rx="3" fill="var(--accent,#2f6f5e)"/>
<text x="172" y="299" class="l" font-size="11" fill="var(--text-2,#4d5753)">16-bit cache (default)</text>
<rect x="360" y="288" width="14" height="14" rx="3" fill="var(--accent,#2f6f5e)" opacity="0.5"/>
<text x="382" y="299" class="l" font-size="11" fill="var(--text-2,#4d5753)">8-bit cache (q8_0)</text>
<rect x="600" y="288" width="14" height="14" rx="3" fill="var(--danger,#a64a4a)"/>
<text x="622" y="299" class="l" font-size="11" fill="var(--text-2,#4d5753)">over the ceiling → CPU</text>
</svg>
