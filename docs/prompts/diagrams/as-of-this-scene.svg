<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 296" role="img" aria-label="A timeline of the book from its start, through earlier scenes, across this scene, to later scenes. original(x) reads at the book's start. lore_as_of(&quot;start&quot;) places lore as this scene opens. lore_as_of(&quot;selection&quot;) places it where the selection begins. entry(x), and lore placed by default, read at the end of this scene. Later scenes are never seen."><style>.l{font-family:var(--sans,"Segoe UI",system-ui,sans-serif)}.m{font-family:var(--mono,Consolas,ui-monospace,monospace)}</style>
<rect x="-30" y="-30" width="920" height="356" fill="var(--diagram-bg,#ffffff)"/>
<text x="0" y="14" class="l" font-size="13.5" fill="var(--accent-strong,#234e43)" font-weight="600">As of this scene</text>
<text x="0" y="32" class="m" font-size="10.5" fill="var(--text-3,#74817b)">Honor's rank, as each call sees it</text>
<text x="170" y="62" text-anchor="middle" class="l" font-size="11.5" fill="var(--text-2,#4d5753)">Earlier scenes</text>
<text x="500" y="62" text-anchor="middle" class="l" font-size="11.5" fill="var(--accent-strong,#234e43)" font-weight="600">This scene</text>
<text x="780" y="62" text-anchor="middle" class="l" font-size="11.5" fill="var(--danger,#a64a4a)" font-weight="600">Later scenes — never seen</text>
<rect x="300" y="96" width="400" height="28" rx="4" fill="var(--accent-soft,#edf6f2)" stroke="var(--accent,#2f6f5e)"/>
<rect x="480" y="99" width="100" height="22" rx="3" fill="var(--accent,#2f6f5e)" fill-opacity="0.18"/>
<text x="530" y="140" text-anchor="middle" class="m" font-size="10" fill="var(--text-3,#74817b)">selection</text>
<rect x="700" y="96" width="160" height="28" rx="4" fill="var(--inset,#f1f5f3)" stroke="var(--danger,#a64a4a)" stroke-dasharray="4 3"/>
<path d="M40 110 H300 M700 110 H860" fill="none" stroke="var(--border-strong,#b4c2bc)" stroke-width="2"/>
<path d="M300 110 H700" fill="none" stroke="var(--accent,#2f6f5e)" stroke-width="2"/>
<circle cx="40" cy="110" r="5" fill="var(--surface,#ffffff)" stroke="var(--text-2,#4d5753)" stroke-width="1.5"/>
<path d="M160 104 L166 110 L160 116 L154 110 Z" fill="var(--text-2,#4d5753)"/>
<text x="160" y="88" text-anchor="middle" class="m" font-size="10.5" fill="var(--text-2,#4d5753)">→ Lieutenant</text>
<path d="M630 104 L636 110 L630 116 L624 110 Z" fill="var(--text-2,#4d5753)"/>
<text x="630" y="88" text-anchor="middle" class="m" font-size="10.5" fill="var(--text-2,#4d5753)">→ Captain</text>
<path d="M780 104 L786 110 L780 116 L774 110 Z" fill="var(--text-3,#74817b)"/>
<text x="780" y="88" text-anchor="middle" class="m" font-size="10.5" fill="var(--text-3,#74817b)">→ Commodore</text>
<path d="M40 116 V150 M300 124 V150 M480 124 V200 M700 124 V150" fill="none" stroke="var(--border-strong,#b4c2bc)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="166" class="m" font-size="11" fill="var(--accent-strong,#234e43)">original(x)</text>
<text x="40" y="184" class="l" font-size="11.5" fill="var(--text,#242424)" font-weight="600">Ensign</text>
<text x="40" y="200" class="m" font-size="10.5" fill="var(--text-3,#74817b)">as the book began</text>
<text x="300" y="166" class="m" font-size="11" fill="var(--accent-strong,#234e43)">lore_as_of("start")</text>
<text x="300" y="184" class="l" font-size="11.5" fill="var(--text,#242424)" font-weight="600">Lieutenant</text>
<text x="300" y="200" class="m" font-size="10.5" fill="var(--text-3,#74817b)">as the scene opens</text>
<text x="480" y="216" class="m" font-size="11" fill="var(--accent-strong,#234e43)">lore_as_of("selection")</text>
<text x="480" y="234" class="l" font-size="11.5" fill="var(--text,#242424)" font-weight="600">Lieutenant</text>
<text x="480" y="250" class="m" font-size="10.5" fill="var(--text-3,#74817b)">where the selection starts</text>
<text x="700" y="166" class="m" font-size="11" fill="var(--accent-strong,#234e43)">entry(x) · the default</text>
<text x="700" y="184" class="l" font-size="11.5" fill="var(--text,#242424)" font-weight="600">Captain</text>
<text x="700" y="200" class="m" font-size="10.5" fill="var(--text-3,#74817b)">up to the scene's end</text>
<text x="0" y="282" class="l" font-size="11" fill="var(--text-2,#4d5753)">◆ a change to a lore entry. A prompt with no scene reads every entry as the book began.</text>
</svg>
