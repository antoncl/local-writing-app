  pages: '“Dat Buck two devils,” was François’s rejoinder. “All de tam I watch dat Buck I know for sure.
    Lissen: some dam fine day heem get mad lak hell an’ den heem chew dat Spitz all up an’ spit heem out
    on de snow. Sure. I know.”


    From then on it was war between them. Spitz, as lead-dog and acknowledged master of the team, felt
    his supremacy threatened by this strange Southland dog. And strange Buck was to him, for of the many
    Southland dogs he had known, not one had shown up worthily in camp and on trail. They were all too
    soft, dying under the toil, the frost, and starvation. Buck was the exception. He alone endured and
    prospered, matching the husky in strength, savagery, and cunning. Then he was a masterful dog, and
    what made him dangerous was the fact that the club of the man in the red sweater had knocked all blind
    pluck and rashness out of his desire for mastery. He was preeminently cunning, and could bide his
    time with a patience that was nothing less than primitive.


    It was inevitable that the clash for leadership should come. Buck wanted it. He wanted it because
    it was his nature, because he had been gripped tight by that nameless, incomprehensible pride of the
    trail and trace—that pride which holds dogs in the toil to the last gasp, which lures them to die
    joyfully in the harness, and breaks their hearts if they are cut out of the harness. This was the
    pride of Dave as wheel-dog, of Sol-leks as he pulled with all his strength; the pride that laid hold
    of them at break of camp, transforming them from sour and sullen brutes into straining, eager, ambitious
    creatures; the pride that spurred them on all day and dropped them at pitch of camp at night, letting
    them fall back into gloomy unrest and uncontent. This was the pride that bore up Spitz and made him
    thrash the sled-dogs who blundered and shirked in the traces or hid away at harness-up time in the
    morning. Likewise it was this pride that made him fear Buck as a possible lead-dog. And this was Buck’s
    pride, too.


    He openly threatened the other’s leadership. He came between him and the shirks he should have punished.
    And he did it deliberately. One night there was a heavy snowfall, and in the morning Pike, the malingerer,
    did not appear. He was securely hidden in his nest under a foot of snow. François called him and sought
    him in vain. Spitz was wild with wrath. He raged through the camp, smelling and digging in every likely
    place, snarling so frightfully that Pike heard and shivered in his hiding-place.


    But when he was at last unearthed, and Spitz flew at him to punish him, Buck flew, with equal rage,
    in between. So unexpected was it, and so shrewdly managed, that Spitz was hurled backward and off
    his feet. Pike, who had been trembling abjectly, took heart at this open mutiny, and sprang upon his
    overthrown leader. Buck, to whom fair play was a forgotten code, likewise sprang upon Spitz. But François,
    chuckling at the incident while unswerving in the administration of justice, brought his lash down
    upon Buck with all his might. This failed to drive Buck from his prostrate rival, and the butt of
    the whip was brought into play. Half-stunned by the blow, Buck was knocked backward and the lash laid
    upon him again and again, while Spitz soundly punished the many times offending Pike.


    In the days that followed, as Dawson grew closer and closer, Buck still continued to interfere between
    Spitz and the culprits; but he did it craftily, when François was not around, With the covert mutiny
    of Buck, a general insubordination sprang up and increased. Dave and Sol-leks were unaffected, but
    the rest of the team went from bad to worse. Things no longer went right. There was continual bickering
    and jangling. Trouble was always afoot, and at the bottom of it was Buck. He kept François busy, for
    the dog-driver was in constant apprehension of the life-and-death struggle between the two which he
    knew must take place sooner or later; and on more than one night the sounds of quarrelling and strife
    among the other dogs turned him out of his sleeping robe, fearful that Buck and Spitz were at it.


    But the opportunity did not present itself, and they pulled into Dawson one dreary afternoon with
    the great fight still to come. Here were many men, and countless dogs, and Buck found them all at
    work. It seemed the ordained order of things that dogs should work. All day they swung up and down
    the main street in long teams, and in the night their jingling bells still went by. They hauled cabin
    logs and firewood, freighted up to the mines, and did all manner of work that horses did in the Santa
    Clara Valley. Here and there Buck met Southland dogs, but in the main they were the wild wolf husky
    breed. Every night, regularly, at nine, at twelve, at three, they lifted a nocturnal song, a weird
    and eerie chant, in which it was Buck’s delight to join.


    With the aurora borealis flaming coldly overhead, or the stars leaping in the frost dance, and the
    land numb and frozen under its pall of snow, this song of the huskies might have been the defiance
    of life, only it was pitched in minor key, with long-drawn wailings and half-sobs, and was more the
    pleading of life, the articulate travail of existence. It was an old song, old as the breed itself—one
    of the first songs of the younger world in a day when songs were sad. It was invested with the woe
    of unnumbered generations, this plaint by which Buck was so strangely stirred. When he moaned and
    sobbed, it was with the pain of living that was of old the pain of his wild fathers, and the fear
    and mystery of the cold and dark that was to them fear and mystery. And that he should be stirred
    by it marked the completeness with which he harked back through the ages of fire and roof to the raw
    beginnings of life in the howling ages.


    Seven days from the time they pulled into Dawson, they dropped down the steep bank by the Barracks
    to the Yukon Trail, and pulled for Dyea and Salt Water. Perrault was carrying despatches if anything
    more urgent than those he had brought in; also, the travel pride had gripped him, and he purposed
    to make the record trip of the year. Several things favored him in this. The week’s rest had recuperated
    the dogs and put them in thorough trim. The trail they had broken into the country was packed hard
    by later journeyers. And further, the police had arranged in two or three places deposits of grub
    for dog and man, and he was travelling light.


    They made Sixty Mile, which is a fifty-mile run, on the first day; and the second day saw them booming
    up the Yukon well on their way to Pelly. But such splendid running was achieved not without great
    trouble and vexation on the part of François. The insidious revolt led by Buck had destroyed the solidarity
    of the team. It no longer was as one dog leaping in the traces. The encouragement Buck gave the rebels
    led them into all kinds of petty misdemeanors. No more was Spitz a leader greatly to be feared. The
    old awe departed, and they grew equal to challenging his authority. Pike robbed him of half a fish
    one night, and gulped it down under the protection of Buck. Another night Dub and Joe fought Spitz
    and made him forego the punishment they deserved. And even Billee, the good-natured, was less good-natured,
    and whined not half so placatingly as in former days. Buck never came near Spitz without snarling
    and bristling menacingly. In fact, his conduct approached that of a bully, and he was given to swaggering
    up and down before Spitz’s very nose.


    The breaking down of discipline likewise affected the dogs in their relations with one another. They
    quarrelled and bickered more than ever among themselves, till at times the camp was a howling bedlam.
    Dave and Sol-leks alone were unaltered, though they were made irritable by the unending squabbling.
    François swore strange barbarous oaths, and stamped the snow in futile rage, and tore his hair. His
    lash was always singing among the dogs, but it was of small avail. Directly his back was turned they
    were at it again. He backed up Spitz with his whip, while Buck backed up the remainder of the team.
    François knew he was behind all the trouble, and Buck knew he knew; but Buck was too clever ever again
    to be caught red-handed. He worked faithfully in the harness, for the toil had become a delight to
    him; yet it was a greater delight slyly to precipitate a fight amongst his mates and tangle the traces.'
  excerpt: 'He was older than the days he had seen and the breaths he had drawn. He linked the past with
    the present, and the eternity behind him throbbed through him in a mighty rhythm to which he swayed
    as the tides and seasons swayed. He sat by John Thornton’s fire, a broad-breasted dog, white-fanged
    and long-furred; but behind him were the shades of all manner of dogs, half-wolves and wild wolves,
    urgent and prompting, tasting the savor of the meat he ate, thirsting for the water he drank, scenting
    the wind with him, listening with him and telling him the sounds made by the wild life in the forest,
    dictating his moods, directing his actions, lying down to sleep with him when he lay down, and dreaming
    with him and beyond him and becoming themselves the stuff of his dreams.


    So peremptorily did these shades beckon him, that each day mankind and the claims of mankind slipped
    farther from him. Deep in the forest a call was sounding, and as often as he heard this call, mysteriously
    thrilling and luring, he felt compelled to turn his back upon the fire and the beaten earth around
    it, and to plunge into the forest, and on and on, he knew not where or why; nor did he wonder where
    or why, the call sounding imperiously, deep in the forest. But as often as he gained the soft unbroken
    earth and the green shade, the love for John Thornton drew him back to the fire again.


    Thornton alone held him. The rest of mankind was as nothing. Chance travellers might praise or pet
    him; but he was cold under it all, and from a too demonstrative man he would get up and walk away.
    When Thornton’s partners, Hans and Pete, arrived on the long-expected raft, Buck refused to notice
    them till he learned they were close to Thornton; after that he tolerated them in a passive sort of
    way, accepting favors from them as though he favored them by accepting. They were of the same large
    type as Thornton, living close to the earth, thinking simply and seeing clearly; and ere they swung
    the raft into the big eddy by the saw-mill at Dawson, they understood Buck and his ways, and did not
    insist upon an intimacy such as obtained with Skeet and Nig.'
