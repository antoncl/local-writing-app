  pages: '"I met a chump deh odder day way up in deh city," he said. "I was goin'' teh see a frien'' of
    mine. When I was a-crossin'' deh street deh chump runned plump inteh me, an'' den he turns aroun''
    an'' says, ''Yer insolen'' ruffin,'' he says, like dat. ''Oh, gee,'' I says, ''oh, gee, go teh hell
    and git off deh eart'','' I says, like dat. See? ''Go teh hell an'' git off deh eart'','' like dat.
    Den deh blokie he got wild. He says I was a contempt''ble scoun''el, er somet''ing like dat, an''
    he says I was doom'' teh everlastin'' pe''dition an'' all like dat. ''Gee,'' I says, ''gee! Deh hell
    I am,'' I says. ''Deh hell I am,'' like dat. An'' den I slugged ''im. See?"


    With Jimmie in his company, Pete departed in a sort of a blaze of glory from the Johnson home. Maggie,
    leaning from the window, watched him as he walked down the street.


    Here was a formidable man who disdained the strength of a world full of fists. Here was one who had
    contempt for brass-clothed power; one whose knuckles could defiantly ring against the granite of law.
    He was a knight.


    Turning, Maggie contemplated the dark, dust-stained walls, and the scant and crude furniture of her
    home. A clock, in a splintered and battered oblong box of varnished wood, she suddenly regarded as
    an abomination. She noted that it ticked raspingly. The almost vanished flowers in the carpet-pattern,
    she conceived to be newly hideous. Some faint attempts she had made with blue ribbon, to freshen the
    appearance of a dingy curtain, she now saw to be piteous.


    She reflected upon the collar and cuff factory. It began to appear to her mind as a dreary place of
    endless grinding. Pete''s elegant occupation brought him, no doubt, into contact with people who had
    money and manners. It was probable that he had a large acquaintance of pretty girls. He must have
    great sums of money to spend.


    To her the earth was composed of hardships and insults. She felt instant admiration for a man who
    openly defied it. She thought that if the grim angel of death should clutch his heart, Pete would
    shrug his shoulders and say: "Oh, ev''ryt''ing goes."


    She anticipated that he would come again shortly. She spent some of her week''s pay in the purchase
    of flowered cretonne for a lambrequin. She made it with infinite care and hung it to the slightly-careening
    mantel, over the stove, in the kitchen. She studied it with painful anxiety from different points
    in the room. She wanted it to look well on Sunday night when, perhaps, Jimmie''s friend would come.
    On Sunday night, however, Pete did not appear.


    A few evenings later Pete entered with fascinating innovations in his apparel. As she had seen him
    twice and he had different suits on each time, Maggie had a dim impression that his wardrobe was prodigiously
    extensive.


    Over the eternal collars and cuffs in the factory Maggie spent the most of three days in making imaginary
    sketches of Pete and his daily environment. She imagined some half dozen women in love with him and
    thought he must lean dangerously toward an indefinite one, whom she pictured with great charms of
    person, but with an altogether contemptible disposition.


    She saw the golden glitter of the place where Pete was to take her. An entertainment of many hues
    and many melodies where she was afraid she might appear small and mouse-colored.


    Her mother drank whiskey all Friday morning. With lurid face and tossing hair she cursed and destroyed
    furniture all Friday afternoon. When Maggie came home at half-past six her mother lay asleep amidst
    the wreck of chairs and a table. Fragments of various household utensils were scattered about the
    floor. She had vented some phase of drunken fury upon the lambrequin. It lay in a bedraggled heap
    in the corner.


    "Hah," she snorted, sitting up suddenly, "where deh hell yeh been? Why deh hell don'' yeh come home
    earlier? Been loafin'' ''round deh streets. Yer gettin'' teh be a reg''lar devil."


    When Pete arrived Maggie, in a worn black dress, was waiting for him in the midst of a floor strewn
    with wreckage. The curtain at the window had been pulled by a heavy hand and hung by one tack, dangling
    to and fro in the draft through the cracks at the sash. The knots of blue ribbons appeared like violated
    flowers. The fire in the stove had gone out. The displaced lids and open doors showed heaps of sullen
    grey ashes. The remnants of a meal, ghastly, like dead flesh, lay in a corner. Maggie''s red mother,
    stretched on the floor, blasphemed and gave her daughter a bad name.


    An orchestra of yellow silk women and bald-headed men on an elevated stage near the centre of a great
    green-hued hall, played a popular waltz. The place was crowded with people grouped about little tables.
    A battalion of waiters slid among the throng, carrying trays of beer glasses and making change from
    the inexhaustible vaults of their trousers pockets. Little boys, in the costumes of French chefs,
    paraded up and down the irregular aisles vending fancy cakes. There was a low rumble of conversation
    and a subdued clinking of glasses. Clouds of tobacco smoke rolled and wavered high in air about the
    dull gilt of the chandeliers.


    The vast crowd had an air throughout of having just quitted labor. Men with calloused hands and attired
    in garments that showed the wear of an endless trudge for a living, smoked their pipes contentedly
    and spent five, ten, or perhaps fifteen cents for beer. There was a mere sprinkling of kid-gloved
    men who smoked cigars purchased elsewhere. The great body of the crowd was composed of people who
    showed that all day they strove with their hands. Quiet Germans, with maybe their wives and two or
    three children, sat listening to the music, with the expressions of happy cows. An occasional party
    of sailors from a war-ship, their faces pictures of sturdy health, spent the earlier hours of the
    evening at the small round tables. Very infrequent tipsy men, swollen with the value of their opinions,
    engaged their companions in earnest and confidential conversation. In the balcony, and here and there
    below, shone the impassive faces of women. The nationalities of the Bowery beamed upon the stage from
    all directions.


    Leaning back he regarded with eyes of superiority the scene before them. This attitude affected Maggie
    strongly. A man who could regard such a sight with indifference must be accustomed to very great things.


    It was obvious that Pete had been to this place many times before, and was very familiar with it.
    A knowledge of this fact made Maggie feel little and new.


    Maggie perceived that Pete brought forth all his elegance and all his knowledge of high-class customs
    for her benefit. Her heart warmed as she reflected upon his condescension.


    The orchestra of yellow silk women and bald-headed men gave vent to a few bars of anticipatory music
    and a girl, in a pink dress with short skirts, galloped upon the stage. She smiled upon the throng
    as if in acknowledgment of a warm welcome, and began to walk to and fro, making profuse gesticulations
    and singing, in brazen soprano tones, a song, the words of which were inaudible. When she broke into
    the swift rattling measures of a chorus some half-tipsy men near the stage joined in the rollicking
    refrain and glasses were pounded rhythmically upon the tables. People leaned forward to watch her
    and to try to catch the words of the song. When she vanished there were long rollings of applause.


    Obedient to more anticipatory bars, she reappeared amidst the half-suppressed cheering of the tipsy
    men. The orchestra plunged into dance music and the laces of the dancer fluttered and flew in the
    glare of gas jets. She divulged the fact that she was attired in some half dozen skirts. It was patent
    that any one of them would have proved adequate for the purpose for which skirts are intended. An
    occasional man bent forward, intent upon the pink stockings. Maggie wondered at the splendor of the
    costume and lost herself in calculations of the cost of the silks and laces.


    The dancer''s smile of stereotyped enthusiasm was turned for ten minutes upon the faces of her audience.
    In the finale she fell into some of those grotesque attitudes which were at the time popular among
    the dancers in the theatres up-town, giving to the Bowery public the phantasies of the aristocratic
    theatre-going public, at reduced rates.


    A ventriloquist followed the dancer. He held two fantastic dolls on his knees. He made them sing mournful
    ditties and say funny things about geography and Ireland.


    Two girls, on the bills as sisters, came forth and sang a duet that is heard occasionally at concerts
    given under church auspices. They supplemented it with a dance which of course can never be seen at
    concerts given under church auspices.'
  excerpt: 'Again he wondered vaguely if some of the women of his acquaintance had brothers. Nevertheless,
    his mind did not for an instant confuse himself with those brothers nor his sister with theirs. After
    the mother had, with great difficulty, suppressed the neighbors, she went among them and proclaimed
    her grief. "May Gawd forgive dat girl," was her continual cry. To attentive ears she recited the whole
    length and breadth of her woes.


    "I bringed ''er up deh way a dauter oughta be bringed up an'' dis is how she served me! She went teh
    deh devil deh first chance she got! May Gawd forgive her."


    When arrested for drunkenness she used the story of her daughter''s downfall with telling effect upon
    the police justices. Finally one of them said to her, peering down over his spectacles: "Mary, the
    records of this and other courts show that you are the mother of forty-two daughters who have been
    ruined. The case is unparalleled in the annals of this court, and this court thinks--"


    Of course Jimmie publicly damned his sister that he might appear on a higher social plane. But, arguing
    with himself, stumbling about in ways that he knew not, he, once, almost came to a conclusion that
    his sister would have been more firmly good had she better known why. However, he felt that he could
    not hold such a view. He threw it hastily aside.


    In a hilarious hall there were twenty-eight tables and twenty-eight women and a crowd of smoking men.
    Valiant noise was made on a stage at the end of the hall by an orchestra composed of men who looked
    as if they had just happened in. Soiled waiters ran to and fro, swooping down like hawks on the unwary
    in the throng; clattering along the aisles with trays covered with glasses; stumbling over women''s
    skirts and charging two prices for everything but beer, all with a swiftness that blurred the view
    of the cocoanut palms and dusty monstrosities painted upon the walls of the room. A bouncer, with
    an immense load of business upon his hands, plunged about in the crowd, dragging bashful strangers
    to prominent chairs, ordering waiters here and there and quarreling furiously with men who wanted
    to sing with the orchestra.'
