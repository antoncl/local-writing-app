# The models the prose harness runs (docs/design/measuring-prose-quality.md §2).
#
# Copy to `models.yaml` beside it; the harness reads `models.yaml` if it exists,
# else this file. One entry per model:
#   name         the label used in output folders and reports (a safe file name)
#   provider     ollama | anthropic | openrouter | openai
#   model        the provider's model id
#   max_tokens   the assistant's output cap
#   temperature  the assistant's temperature; omit it for a model that accepts none
#                (the newer Claude models: the app refuses one)
#   primary      true for the one strong cloud model the blind pairs use
#
# Cloud providers need their key in the environment when you run setup_backend.py
# (ANTHROPIC_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY). Keys are never read
# from this file.

models:
  - name: local-qwen
    provider: ollama
    model: "Qwen3.8-9B:latest"
    max_tokens: 4096
    temperature: 0.8
    primary: false

  # The primary strong cloud model (the blind pairs draw from this one only).
  # - name: primary-anthropic
  #   provider: anthropic
  #   model: claude-sonnet-5-5
  #   max_tokens: 4096
  #   primary: true

  # A cheap cloud model.
  # - name: cheap-cloud
  #   provider: openrouter
  #   model: mistralai/mistral-small-3.2-24b-instruct
  #   max_tokens: 4096
  #   temperature: 0.8
  #   primary: false

# The judges (H2, measuring-prose-quality.md section 4.2). Optional; each entry has the
# shape of a `models:` entry without `primary`. setup_backend.py gives them an assistant in
# every fixture project (skip with --no-judges). The judge must be a different family from
# the primary drafter, and is never used on its own model's drafts: judge.py sends a draft
# written by the primary judge's model to `second` instead.
# judges:
#   primary:
#     name: judge-primary
#     provider: openrouter
#     model: google/gemini-3.6-flash
#     max_tokens: 1024
#     temperature: 0
#   second:
