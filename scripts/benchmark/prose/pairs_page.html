<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairs</title>
<style>
  :root {
    --bg: #faf8f4; --panel: #f1eee7; --text: #26231f; --muted: #6f6a60; --line: #ddd8cc;
    --accent: #2f5d8a; --accent-text: #ffffff; --ok: #3f7a4f; --warn: #a4572a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --panel: #232220; --text: #e4e0d8; --muted: #9a958a; --line: #34322e;
      --accent: #7fa8d4; --accent-text: #14120f; --ok: #7fbf8f; --warn: #d9996a;
    }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; margin: 0; }
  button, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 4px; padding: 4px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, .s:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 20px;
           border-bottom: 1px solid var(--line); }
  #progress { color: var(--muted); margin-right: auto; }
  #warn { color: var(--warn); padding: 6px 20px; }
  #layout { display: flex; }
  aside { width: 130px; flex: none; border-right: 1px solid var(--line); padding: 10px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: flex; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  #list li:hover { background: var(--panel); }
  #list li.current { background: var(--panel); outline: 1px solid var(--accent); }
  #list .mark { width: 1.2em; text-align: center; color: var(--muted); }
  #list li.done .mark { color: var(--ok); }
  main { flex: 1; min-width: 0; padding: 18px 24px 60px; }
  .context { color: var(--muted); max-width: 70ch; margin-bottom: 18px; }
  .context summary { cursor: pointer; }
  .context p { white-space: pre-line; margin: 8px 0 0; }
  .sides { display: flex; gap: 36px; align-items: flex-start; }
  .side { flex: 1 1 0; min-width: 0; }
  .side h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); }
  .passage { font: 18px/1.7 Georgia, "Times New Roman", serif; max-width: 34em; }
  .passage p { margin: 0 0 1em; }
  .s { cursor: pointer; border-radius: 2px; }
  .s:hover { background: var(--panel); }
  .s.cut { text-decoration: line-through; color: var(--muted); }
  .keep { margin-top: 12px; }
  .keep button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #fallback { display: none; width: 100%; height: 6em; margin: 6px 20px; max-width: calc(100% - 40px); }
  #help { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; align-items: center; justify-content: center; }
  #help.open { display: flex; }
  #help div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 18px 24px; }
  #help h2 { font-size: 15px; margin: 0 0 8px; }
  #help dt { float: left; clear: left; width: 6.5em; font-family: monospace; }
  #help dd { margin: 0 0 4px 6.5em; }
  @media (max-width: 900px) {
    .sides { flex-direction: column; gap: 28px; }
    aside { display: none; }
    main { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <span id="progress"></span>
  <label>Reader <input id="reader" type="text" placeholder="your name (optional)" autocomplete="off"></label>
  <button id="next" type="button">Next unpicked</button>
  <button id="download" type="button">Download picks</button>
  <button id="copy" type="button">Copy picks</button>
  <button id="helpbtn" type="button" aria-label="Keyboard help">?</button>
</header>
<div id="warn" hidden></div>
<textarea id="fallback" readonly aria-label="Picks JSON"></textarea>
<div id="layout">
  <aside><ul id="list"></ul></aside>
  <main>
    <div id="pair" hidden>
      <div class="context">
        <div id="pov"></div>
        <details><summary>Brief</summary><p id="summary"></p></details>
      </div>
      <div class="sides">
        <section class="side" id="sideA"><h2>A</h2><div class="passage"></div>
          <div class="keep"><button type="button" data-side="A">Keep A</button></div></section>
        <section class="side" id="sideB"><h2>B</h2><div class="passage"></div>
          <div class="keep"><button type="button" data-side="B">Keep B</button></div></section>
      </div>
    </div>
    <div id="empty">Loading…</div>
  </main>
</div>
<div id="help"><div>
  <h2>Keyboard</h2>
  <dl>
    <dt>a / b</dt><dd>keep A / keep B (again to clear)</dd>
    <dt>]  [</dt><dd>next / previous pair</dd>
    <dt>Space</dt><dd>next unpicked pair</dd>
    <dt>click text</dt><dd>mark a sentence you would cut</dd>
    <dt>?</dt><dd>this help</dd>
  </dl>
</div></div>
<script type="application/json" id="pairs-data">__PAIRS_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("pairs-data").textContent);
  var pairs = data.pairs;
  var storageKey = "pairs:" + data.page_id;
  var state = { reader: "", picks: {}, cuts: {} };
  var current = 0;

  function load() {
    try {
      var raw = window.localStorage.getItem(storageKey);
      if (raw) {
        var saved = JSON.parse(raw);
        state.reader = saved.reader || "";
        state.picks = saved.picks || {};
        state.cuts = saved.cuts || {};
      }
    } catch (e) { warn(); }
  }
  function save() {
    try { window.localStorage.setItem(storageKey, JSON.stringify(state)); } catch (e) { warn(); }
  }
  function warn() {
    var el = document.getElementById("warn");
    el.hidden = false;
    el.textContent = "This browser will not keep your progress across a reload: download your picks before closing the page.";
  }

  function $(id) { return document.getElementById(id); }
  function isPicked(p) { return !!state.picks[p.id]; }
  function cutSet(pid, side) {
    state.cuts[pid] = state.cuts[pid] || { A: [], B: [] };
    return state.cuts[pid][side];
  }
  function cutIndex(pid, side, para, sent) {
    var list = cutSet(pid, side);
    for (var i = 0; i < list.length; i++) if (list[i][0] === para && list[i][1] === sent) return i;
    return -1;
  }

  function renderSide(pair, side) {
    var box = $("side" + side).querySelector(".passage");
    box.textContent = "";
    pair[side].forEach(function (sentences, para) {
      var p = document.createElement("p");
      sentences.forEach(function (text, sent) {
        var span = document.createElement("span");
        span.className = "s" + (cutIndex(pair.id, side, para, sent) >= 0 ? " cut" : "");
        span.textContent = text;
        span.tabIndex = 0;
        span.setAttribute("role", "button");
        span.addEventListener("click", function () { toggleCut(pair.id, side, para, sent, span); });
        span.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); toggleCut(pair.id, side, para, sent, span); }
        });
        p.appendChild(span);
        p.appendChild(document.createTextNode(" "));
      });
      box.appendChild(p);
    });
  }
  function toggleCut(pid, side, para, sent, span) {
    var i = cutIndex(pid, side, para, sent);
    if (i >= 0) cutSet(pid, side).splice(i, 1); else cutSet(pid, side).push([para, sent]);
    span.classList.toggle("cut", i < 0);
    save();
  }

  function renderList() {
    var list = $("list");
    list.textContent = "";
    pairs.forEach(function (p, i) {
      var li = document.createElement("li");
      li.className = (i === current ? "current " : "") + (isPicked(p) ? "done" : "");
      var mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = isPicked(p) ? "●" : "○";
      li.appendChild(mark);
      li.appendChild(document.createTextNode(p.id));
      li.addEventListener("click", function () { show(i); });
      list.appendChild(li);
    });
    var done = pairs.filter(isPicked).length;
    $("progress").textContent = done + " of " + pairs.length + " picked";
  }
  function renderKeep() {
    var pid = pairs[current].id;
    document.querySelectorAll(".keep button").forEach(function (b) {
      var on = state.picks[pid] === b.dataset.side;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function show(i) {
    if (i < 0 || i >= pairs.length) return;
    current = i;
    var pair = pairs[i];
    $("empty").hidden = true;
    $("pair").hidden = false;
    $("pov").textContent = "Viewpoint: " + pair.pov;
    $("summary").textContent = pair.summary;
    renderSide(pair, "A");
    renderSide(pair, "B");
    renderKeep();
    renderList();
    if (location.hash !== "#" + pair.id) history.replaceState(null, "", "#" + pair.id);
    window.scrollTo(0, 0);
  }
  function pick(side) {
    var pid = pairs[current].id;
    if (state.picks[pid] === side) delete state.picks[pid]; else state.picks[pid] = side;
    save();
    renderKeep();
    renderList();
  }
  function nextUnpicked() {
    for (var k = 1; k <= pairs.length; k++) {
      var i = (current + k) % pairs.length;
      if (!isPicked(pairs[i])) { show(i); return; }
    }
    $("progress").textContent = "All " + pairs.length + " picked: download your picks.";
  }

  function picksJson() {
    return JSON.stringify({
      page_id: data.page_id, reader: state.reader, picks: state.picks, cuts: state.cuts,
      saved_at: new Date().toISOString()
    }, null, 2);
  }
  function download() {
    var blob = new Blob([picksJson()], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "picks-" + data.page_id + "-" + ((state.reader || "reader").replace(/[^\w-]+/g, "_")) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function copy() {
    var text = picksJson();
    var fallback = $("fallback");
    function manual() { fallback.style.display = "block"; fallback.value = text; fallback.select(); }
    try {
      navigator.clipboard.writeText(text).then(function () {
        $("progress").textContent = "Picks copied.";
      }, manual);
    } catch (e) { manual(); }
  }

  function startIndex() {
    var wanted = pairs.findIndex(function (p) { return "#" + p.id === location.hash; });
    if (wanted >= 0) return wanted;
    var first = pairs.findIndex(function (p) { return !isPicked(p); });
    return first >= 0 ? first : 0;
  }

  document.querySelectorAll(".keep button").forEach(function (b) {
    b.addEventListener("click", function () { pick(b.dataset.side); });
  });
  $("next").addEventListener("click", nextUnpicked);
  $("download").addEventListener("click", download);
  $("copy").addEventListener("click", copy);
  $("helpbtn").addEventListener("click", function () { $("help").classList.toggle("open"); });
  $("help").addEventListener("click", function () { $("help").classList.remove("open"); });
  $("reader").addEventListener("input", function (ev) { state.reader = ev.target.value; save(); });
  window.addEventListener("hashchange", function () { show(startIndex()); });
  document.addEventListener("keydown", function (ev) {
    var tag = ev.target && ev.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === "a" || ev.key === "A") pick("A");
    else if (ev.key === "b" || ev.key === "B") pick("B");
    else if (ev.key === "]") show(current + 1);
    else if (ev.key === "[") show(current - 1);
    else if (ev.key === " ") { ev.preventDefault(); nextUnpicked(); }
    else if (ev.key === "?") $("help").classList.toggle("open");
    else if (ev.key === "Escape") $("help").classList.remove("open");
  });

  load();
  $("reader").value = state.reader;
  show(startIndex());
})();
</script>
</body>
</html>
